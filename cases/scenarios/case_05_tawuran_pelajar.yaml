case_id: "case_05_tawuran_pelajar"
title: "Manajemen Konflik Tawuran Pelajar 3 Sekolah Sukabumi-Cianjur (Graph Coloring)"
description: "Model Conflict Graph & Time-Slot Scheduling berdasarkan insiden nyata tawuran 3 sekolah (SMKN 1 Sagaranten vs Koalisi SMKN 1 Tegalbuleud & SMKN 1 Agrabinta) di Jalan Raya Rambay, Kampung Tagog Bayur. Algoritma pewarnaan graf digunakan untuk mengalokasikan time-slot keberangkatan/kepulangan serta jalur evakuasi warga dan siswa agar kelompok berseteru tidak berpapasan di simpul kritis."
algorithm: "dsatur"

nodes:
  - id: 0
    label: "SMKN 1 Sagaranten (Kelompok A)"
    pos: [10.0, 50.0]
  - id: 1
    label: "Simpul Pertigaan Cigadog - Tangkil"
    pos: [10.0, 35.0]
  - id: 2
    label: "Jalur Penghubung Perbatasan Sukabumi-Cianjur"
    pos: [25.0, 20.0]
  - id: 3
    label: "SMKN 1 Agrabinta Cianjur (Koalisi B1)"
    pos: [35.0, 10.0]
  - id: 4
    label: "Titik Kritis: Jl. Raya Rambay - Kp. Tagog Bayur"
    pos: [10.0, 10.0]
  - id: 5
    label: "SMKN 1 Tegalbuleud (Koalisi B2)"
    pos: [0.0, 5.0]
  - id: 6
    label: "Pos Keamanan Polsek & Puskesmas Tegalbuleud (Zona Netral/Goal)"
    pos: [5.0, 0.0]

edges:
  # Rute pergerakan dari Sagaranten menuju titik pertemuan Rambay
  - from: 0
    to: 1
    weight: 15.0
    capacity: 20.0
  - from: 1
    to: 4
    weight: 25.0
    capacity: 20.0

  # Rute pergerakan dari Agrabinta menuju Rambay
  - from: 3
    to: 2
    weight: 12.0
    capacity: 15.0
  - from: 2
    to: 4
    weight: 18.0
    capacity: 15.0

  # Rute pergerakan dari Tegalbuleud menuju Rambay
  - from: 5
    to: 4
    weight: 5.0
    capacity: 20.0

  # Relasi Konflik Antar Sekolah (Edge Conflict Graph)
  # Sagaranten berkonflik langsung dengan Agrabinta dan Tegalbuleud
  - from: 0
    to: 3
    weight: 1.0
    capacity: 1.0
  - from: 0
    to: 5
    weight: 1.0
    capacity: 1.0

  # Akses Pengamanan dan Evakuasi ke Polsek / Puskesmas Tegalbuleud
  - from: 4
    to: 6
    weight: 3.0
    capacity: 30.0
  - from: 5
    to: 6
    weight: 4.0
    capacity: 20.0

execution_plan:
  start_node: 0
  goal_node: 6
  events:
    - step: 1
      type: "CONFLICT_NODE_TRIGGER"
      target_node: 4
      description: "Bentrokan pecah di Jl. Raya Rambay (Kp. Tagog Bayur)! Sistem melakukan pewarnaan ulang graf (re-coloring) untuk memisahkan jadwal pergerakan dan rute evakuasi warga."
    - step: 2
      type: "CONFLICT_EDGE_TRIGGER"
      target_edge: [1, 2]
      weight: 1.0
      description: "Kelompok simpatisan menutup akses alternatif di perbatasan Cigadog dan Sukabumi-Cianjur."
